<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Jogo da Adivinhação</h1>

        <label for="chute">Adivinhe um número entre 1 a 100:</label>
        <input type="number" id="chute" min="1" max="100">

        <button id="chutar">Chutar</button>
        <p id="resultado" class="resultado">Digite um número e tente adivinhar!</p>
    </main>

    <script src="js/adivinhacao.js"></script>
</body>
</html>
