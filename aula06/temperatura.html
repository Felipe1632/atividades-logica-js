<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define o conjunto de caracteres do documento -->
    <meta charset="UTF-8">
    <!-- Ajusta a página para telas menores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página exibido no navegador -->
    <title>Temperatura | Lógica com JS</title>
    <!-- Conecta o arquivo HTML ao CSS da página -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Conteúdo principal do conversor -->
    <main class="exercicio">
        <h1>Conversor de Temperatura</h1>

        <!-- Escolha do tipo de conversão -->
        <label for="tipo">Converter de:</label>
        <select id="tipo">
            <option value="cParaF">Celsius para Fahrenheit</option>
            <option value="fParaC">Fahrenheit para Celsius</option>
        </select>

        <!-- Campo de entrada do valor -->
        <label for="temp">Temperatura:</label>
        <input type="number" id="temp" step="0.1">

        <button id="converter">Converter</button>

        <p id="resultado" class="resultado">O resultado aparece aqui!</p>
    </main>

    <!-- Importa o JavaScript responsável pelo cálculo -->
    <script src="./../aula10/js/comum.js"></script>
    <script src="./js/temperatura.js"></script>
</body>
</html>
