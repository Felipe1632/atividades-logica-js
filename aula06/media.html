<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define o conjunto de caracteres do documento -->
  <meta charset="UTF-8">
  <!-- Ajusta a página para diferentes tamanhos de tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título exibido na aba do navegador -->
  <title>Média | Lógica com JS</title>
  <!-- Conecta com o arquivo de CSS da página -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Área principal do exercício -->
  <main class="exercicio">
    <!-- Nome da atividade -->
    <h1>Média de duas notas</h1>

    <!-- Campo para a primeira nota -->
    <label for="nota1">Nota 1</label>
    <input type="number" id="nota1" step="0.1">

    <!-- Campo para a segunda nota -->
    <label for="nota2">Nota 2</label>
    <input type="number" id="nota2" step="0.1">

    <!-- Botão para calcular a média -->
    <button id="calcular">Calcular</button>

    <!-- Espaço para mostrar a média calculada -->
    <p id="resultado" class="resultado">O resultado aparece aqui.</p>
  </main>

  <!-- Importa o JavaScript que realiza o cálculo -->
  <script src="js/media.js"></script>
</body>
</html>
